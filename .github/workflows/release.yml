# Sürüm etiketi gönderilince (git tag v0.5.0 && git push --tags) Windows, macOS ve
# Linux paketlerini derler ve GitHub "Releases" sayfasına yükler.
#
# Tedarik zinciri: action'lar commit SHA'sıyla sabitlenmiştir (etiket sonradan başka koda
# taşınamaz); Python bağımlılıkları packaging/requirements-release.txt ile sabittir;
# Inno Setup sürümü sabittir. Yazma izni yalnızca yayın işindedir.
# Paketler yayınlandıktan sonra imzalamak için: python packaging/sign_release.py vX.Y.Z
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Inno Setup (Windows kurulum programı)
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.7.1 --no-progress -y
        continue-on-error: true
      - name: Sabit sürümlü bağımlılıklar
        run: |
          pip install -r packaging/requirements-release.txt
          pip install --no-deps -e .
      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Paketle
        run: python packaging/build.py
      - name: SHA-256 özetleri
        shell: bash
        run: cd dist && for f in Kurgu-*; do [ -f "$f" ] && (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"); done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kurgu-${{ matrix.os }}
          path: dist/Kurgu-*

  release:
    needs: build
    # Bir sistemin paketi düşse bile derlenebilenler yayınlansın
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
