name: Translation · Çeviri
description: Add or fix an interface language · Arayüz dili ekleyin ya da düzeltin
labels: [translation]
body:
  - type: input
    id: lang
    attributes:
      label: Language · Dil
      placeholder: "German (de)"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details · Ayrıntılar
      description: |
        Wrong or missing strings, or a note that you're starting a new translation
        (see CONTRIBUTING.md → Translations).
